apiVersion: apps/v1
kind: Deployment
metadata:
name: demo-app-deployment
labels:
app: demo-app
spec:
replicas:3
selector:
matchLabels:
app: demo-app
template:
metadata:
labels:
app: demo-app
spec:
containers:
-name: app
image: <ваш-логин>/demo-app:latest
ports:
-containerPort:5000
env:
-name: APP_VERSION
value:"v1"
